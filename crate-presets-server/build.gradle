plugins { id 'java' }
group = 'com.tonkid.cratepreset'
version = '0.4.0'
base.archivesName='CratePresetBridge-26.3'
repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}
dependencies { compileOnly 'io.papermc.paper:paper-api:26.3.build.+' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
