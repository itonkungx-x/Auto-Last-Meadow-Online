name: CratePresetBridge
version: '0.4.0'
main: com.tonkid.cratepreset.CratePresetBridge
api-version: '26.3'
depend: [ExcellentCrates]
description: Permanent, replayable custom item crate presets with weighted rarity rules
commands:
  cratepreset:
    aliases: [cpreset]
    description: Save and replay item crate presets from a chest GUI
    usage: /cratepreset
    permission: cratepreset.admin
permissions:
  cratepreset.admin:
    description: Allows access to permanent item templates and ExcellentCrates reward changes
    default: op
