name: Build Crate Preset Bridge 26.3
on:
  push:
    branches: [crate-auto-reward-fabric-26-3]
    paths:
      - 'crate-presets-server/**'
      - '.github/workflows/crate-presets-server.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - run: gradle -p crate-presets-server clean build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CratePresetBridge-26.3-v0.4.0-server-plugin
          path: crate-presets-server/build/libs/*.jar
